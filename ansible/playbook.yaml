- name: Set up OS
  hosts: embedded
  remote_user: root
  gather_facts: no
  
  pre_tasks:
    - name: update packages
      raw: apt-get update
      changed_when: false
      
    - name: Install Python
      raw: apt-get install -y python3-minimal python3-apt
      changed_when: false
      
    - name: Gather facts
      setup:

  tasks:
    - name: Copy temp-sim
      ansible.builtin.copy:
        src: ../dist/tempsim
        dest: /usr/local/bin/temp-sim

    - name: Copy unit files
      ansible.builtin.copy:
        src: ../systemd/unitFiles/
        dest: /etc/systemd/system

    - name: Enable temperature simulator socket
      ansible.builtin.systemd_service:
        name: temperature-simulator.socket
        enabled: true
        daemon_reload: true
        state: started

    - name: Enable volume simulator socket
      ansible.builtin.systemd_service:
        name: volume-simulator.socket
        enabled: true
        daemon_reload: true
        state: started

        
  post_tasks:
    - name: Remove Python
      raw: apt-get purge -y python3 python3-minimal
      changed_when: true
      
    - name: Autoremove
      raw: apt-get autoremove -y --purge
      changed_when: true
