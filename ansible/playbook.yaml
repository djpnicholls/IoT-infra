- name: Set up OS
  hosts: embedded
  remote_user: root
  
  tasks:
    - name: Copy temp-sim
      ansible.builtin.copy:
        src: ../dist/tempsim
        dest: /usr/local/bin/temp-sim

    - name: Copy unit files
      ansible.builtin.copy:
        src: ../systemd/unitFiles/
        dest: /etc/systemd/system

    - name: Enable temperature simulator socket
      ansible.builtin.systemd_service:
        name: temperature-simulator.socket
        enabled: true
        daemon_reload: true
        state: started

    - name: Enable volume simulator socket
      ansible.builtin.systemd_service:
        name: volume-simulator.socket
        enabled: true
        daemon_reload: true
        state: started
